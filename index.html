<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>kimura pf</title>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #aaa;
    }

    header {
      background-color: #aaa;
      color: #fff;
      font-size: 24px;
      font-family: Arial, Helvetica, sans-serif;
      height: 36px;
      padding-top: 6px;
      padding-left: 20px;
    }

    #wrapper {
      background-image: url(wa.svg);
      background-position: right bottom;
      background-repeat: no-repeat;
      background-size: 80vh;
      height: 90vh;
      background-color: #fff;
      line-height: 1;
      margin-left: 20px;
    }

    #cirecle {
      display: inline-block;
      height: 50vh;
    }

    .hlin {
      display: inline-block;
      position: relative;
      top: 8px;
      height: 1px;
      background-color: #444444;
      width: 30vw;
      margin: 12px;
      margin-top: 40vh;
    }

    #wrapper a {
      line-height: 1;
      text-decoration: none;
      font-weight: bold;
      color: #02f;
      font-size: 22px;
      text-shadow:
        1px 2px 0 #fff,
        -1px 2px 0 #fff,
        1px -2px 0 #fff,
        -1px -2px 0 #fff;
    }

    .msg {
      position: relative;
      left: 32vw;
      font-size: 12px;
      margin: 8px;
    }
  </style>

  <body>
    <header>SHINGO KIMURA</header>
    <div id="wrapper">
      <span class="hlin"></span>
      <a href="matchsttckpuzul/puzul.html">MatchstickPuzul</a><br>
      <span class="msg">コンテンツは1100px程度の横幅が必要です</span>
    </div>
  </body>
</html>
